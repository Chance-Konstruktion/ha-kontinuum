# pytest-Konfiguration für ha-kontinuum
#
# asyncio_mode = auto: Die hass-Fixture von
# pytest-homeassistant-custom-component ist ein schlichter
# ``@pytest.fixture``-Async-Generator. Im Strict-Modus von pytest-asyncio
# bleibt er unaufgeloest haengen (der Test erhaelt ein async_generator-
# Objekt statt der Test-Home). Home Assistant selbst faehrt seine Tests
# im Auto-Modus; die expliziten @pytest.mark.asyncio-Marker der
# bestaehenden Tests stoeren sich daran nicht.
#
# asyncio_default_fixture_loop_scope: function — stillt die
# pytest-asyncio-Verwahrung ueber den ungesetzten Standard und haelt
# jede Test-Home in ihrem eigenen Loop.

[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
