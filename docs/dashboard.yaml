# ┌──────────────────────────────────────────────────────────────────────┐
# │ HACS-Frontend-Abhängigkeiten (Custom Cards)                            │
# │  • Mushroom          – github.com/piitaya/lovelace-mushroom            │
# │                        (bereits genutzt: custom:mushroom-chips-card)   │
# │  • config-template-card – github.com/iantrich/config-template-card     │
# │                        (neu: rendert die Confirm-Queue mit             │
# │                         Bestätigen/Ablehnen-Buttons pro Eintrag)       │
# │ Beide über HACS → Frontend installieren, sonst bleiben die Karten leer.│
# └──────────────────────────────────────────────────────────────────────┘
title: 🧠 KONTINUUM
views:
  - title: Übersicht
    path: kontinuum
    icon: mdi:brain
    badges: []
    cards:

      # ── KOPFZEILE: Status + Modus ─────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.kontinuum_status
            name: Status
            icon: mdi:brain
          - type: entity
            entity: sensor.kontinuum_mode
            name: Modus
            icon: mdi:home-automation
          - type: entity
            entity: sensor.kontinuum_room
            name: Raum
            icon: mdi:map-marker
          - type: entity
            entity: sensor.kontinuum_persons_home
            name: Personen
            icon: mdi:account-group

      # ── WARTENDE BESTÄTIGUNGEN (nur im Confirm-Modus) ────────────────
      # Die Confirm-Queue liegt als JSON-Liste im Attribut
      # sensor.kontinuum_status → prefrontal.pending_confirms_list (verschachtelt
      # unter `prefrontal`). Ein nativer Card-Typ kann pro Zeile keine Buttons
      # mit der jeweiligen confirm_id bauen, daher config-template-card: es
      # iteriert die Liste und ruft pro Eintrag die bestehenden Services
      # kontinuum.confirm_action / kontinuum.reject_action mit der `id` auf.
      # Rendert NICHTS außerhalb des Confirm-Modus (operation_mode != 'confirm').
      - type: custom:config-template-card
        entities:
          - sensor.kontinuum_status
        variables:
          MODE: >
            (states['sensor.kontinuum_status'].attributes.prefrontal || {}).operation_mode || 'shadow'
          PENDING: >
            (states['sensor.kontinuum_status'].attributes.prefrontal || {}).pending_confirms_list || []
        card:
          type: vertical-stack
          cards: >
            ${ MODE !== 'confirm' ? [] : [
              { type: 'markdown',
                content: '## ✅ Wartende Bestätigungen (' + PENDING.length + ')' },
              ...(PENDING.length === 0
                ? [{ type: 'markdown',
                     content: '_Keine wartenden Bestätigungen._' }]
                : PENDING.map(item => ({
                    type: 'horizontal-stack',
                    cards: [
                      { type: 'markdown',
                        content: '**' + (item.room || '?') + ' · '
                          + (item.semantic || '') + ' · '
                          + (item.action || item.token) + '**\n`'
                          + (item.entity_id || '') + '`'
                          + (item.reasoning ? '\n\n' + item.reasoning : '') },
                      { type: 'button', name: 'Bestätigen', icon: 'mdi:check',
                        show_state: false,
                        tap_action: { action: 'call-service',
                          service: 'kontinuum.confirm_action',
                          data: { confirm_id: item.id } } },
                      { type: 'button', name: 'Ablehnen', icon: 'mdi:close',
                        show_state: false,
                        tap_action: { action: 'call-service',
                          service: 'kontinuum.reject_action',
                          data: { confirm_id: item.id } } }
                    ]
                  }))
              ),
              { type: 'button', name: 'Alle bestätigen', icon: 'mdi:check-all',
                show_state: false,
                tap_action: { action: 'call-service',
                  service: 'kontinuum.confirm_action',
                  data: { confirm_all: true } } }
            ] }

      # ── LERNSTATUS ────────────────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.kontinuum_events
            name: Events
            icon: mdi:counter
          - type: entity
            entity: sensor.kontinuum_accuracy
            name: Genauigkeit
            icon: mdi:target
          - type: entity
            entity: sensor.kontinuum_cerebellum
            name: Routinen
            icon: mdi:cog-transfer
          - type: entity
            entity: sensor.kontinuum_basal_ganglia
            name: Habits
            icon: mdi:arrow-decision

      # ── GEHIRN-AKTIVITÄT ─────────────────────────────────────────────
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: sensor.kontinuum_status
        title: 🧠 Gehirn-Aktivität

      - type: grid
        columns: 3
        square: false
        cards:
          - type: gauge
            entity: sensor.kontinuum_thalamus_activity
            name: Thalamus
            min: 0
            max: 1
            needle: true
            severity:
              green: 0.5
              yellow: 0.2
              red: 0
          - type: gauge
            entity: sensor.kontinuum_hippocampus_activity
            name: Hippocampus
            min: 0
            max: 1
            needle: true
            severity:
              green: 0.5
              yellow: 0.2
              red: 0
          - type: gauge
            entity: sensor.kontinuum_hypothalamus_activity
            name: Hypothalamus
            min: 0
            max: 1
            needle: true
            severity:
              green: 0.5
              yellow: 0.2
              red: 0
          - type: gauge
            entity: sensor.kontinuum_insula_activity
            name: Insula
            min: 0
            max: 1
            needle: true
            severity:
              green: 0.5
              yellow: 0.2
              red: 0
          - type: gauge
            entity: sensor.kontinuum_amygdala_activity
            name: Amygdala
            min: 0
            max: 1
            needle: true
            severity:
              green: 0
              yellow: 0.3
              red: 0.7
          - type: gauge
            entity: sensor.kontinuum_cerebellum_activity
            name: Cerebellum
            min: 0
            max: 1
            needle: true
            severity:
              green: 0.5
              yellow: 0.2
              red: 0
          - type: gauge
            entity: sensor.kontinuum_spatial_activity
            name: Spatial Cortex
            min: 0
            max: 1
            needle: true
            severity:
              green: 0.5
              yellow: 0.2
              red: 0
          - type: gauge
            entity: sensor.kontinuum_prefrontal_activity
            name: Präfrontaler Kortex
            min: 0
            max: 1
            needle: true
            severity:
              green: 0.5
              yellow: 0.2
              red: 0
          - type: gauge
            entity: sensor.kontinuum_basalganglia_activity
            name: Basalganglien
            min: 0
            max: 1
            needle: true
            severity:
              green: 0.5
              yellow: 0.2
              red: 0

      # ── VORHERSAGE & STANDORT ─────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.kontinuum_prediction
            name: Vorhersage
            icon: mdi:crystal-ball
          - type: entity
            entity: sensor.kontinuum_location
            name: Standort
            icon: mdi:crosshairs-gps
          - type: entity
            entity: sensor.kontinuum_last_event
            name: Letztes Event
            icon: mdi:lightning-bolt

      # ── ENERGIE ──────────────────────────────────────────────────────
      - type: entity
        entity: sensor.kontinuum_energy
        name: Energie
        icon: mdi:battery

      # ── BASALGANGLIEN DETAILS ─────────────────────────────────────────
      - type: entities
        title: Basalganglien – Gewohnheiten
        entities:
          - entity: sensor.kontinuum_basal_ganglia
            name: Habits gesamt
          - type: attribute
            entity: sensor.kontinuum_basal_ganglia
            attribute: go_actions
            name: Go-Aktionen
            icon: mdi:check-circle
          - type: attribute
            entity: sensor.kontinuum_basal_ganglia
            attribute: nogo_actions
            name: NoGo-Aktionen
            icon: mdi:cancel
          - type: attribute
            entity: sensor.kontinuum_basal_ganglia
            attribute: dopamine_signal
            name: Dopamin-Signal
            icon: mdi:chemical-weapon
          - type: attribute
            entity: sensor.kontinuum_basal_ganglia
            attribute: q_entries
            name: Q-Value Einträge
            icon: mdi:table

      # ── UNBEKANNTE ENTITIES ───────────────────────────────────────────
      - type: entity
        entity: sensor.kontinuum_unknown_entities
        name: Entities ohne Raum
        icon: mdi:help-circle-outline
