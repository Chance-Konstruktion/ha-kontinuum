# Sucht Zugangsdaten im Code UND in der ganzen Historie. Geloescht
# heisst bei git nicht weg -- ein einmal committetes Token bleibt
# auffindbar, bis es beim Anbieter zurueckgezogen wird.
include:
  - project: 'claude/ci-vorlagen'
    file: '/vorlagen/geheimnisse.yml'
    ref: 65c48c20f447f46baaa1a46cda655b656cca15e3

# CI-Vorlage
#
# Dieselbe Datei liegt in allen Repositories. Sie passt sich selbst an:
# Jeder Job hat eine `exists`-Regel und laeuft nur, wenn es in diesem
# Repository etwas fuer ihn zu tun gibt. Ein Repo ohne tests/ bekommt also
# keinen roten pytest-Job, sondern gar keinen.
#
# Der Grund fuer diese Bauweise: Eine Vorlage, die man pro Repo anpassen
# muss, wird nach dem dritten Repo nicht mehr angepasst.

stages:
  - test
  - validate
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ── Tests ─────────────────────────────────────────────────────────────
# Node wird ausdruecklich installiert. Tests, die Node brauchen,
# ueberspringen sich sonst selbst -- die Pipeline waere gruen, ohne dass
# sie je gelaufen waeren. -rs schreibt jede Auslassung samt Grund ins Log.
#
# DIE BELEGTE UMGEBUNG (ha-kontinuum #2): python:3.13-Image plus die
# gepinnten Fassungen aus requirements_test.txt (Home Assistant 2026.2.3,
# pytest 9.0.0, pytest-asyncio 1.3.0 -- belegt durch das Artefakt
# installierte-pakete.txt der Pipeline 18153). Wer woanders rot sieht
# (Claudes pve-Morgen mit Python 3.11 am 06.10.), hat eine andere
# Umgebung vor sich -- diese hier ist die, die zaehlt.
pytest:
  stage: test
  image: python:3.13
  cache:
    # Fester Schluessel, ausdruecklich OHNE $CI_COMMIT_REF_SLUG.
    #
    # Caches sind in GitLab ohnehin schon pro Projekt getrennt. Der
    # Zweigname im Schluessel bringt keine Trennung dazu, die man
    # braucht, sondern zwei Nachteile: Auf der Runner-Platte sammelt
    # sich pro Zweig ein Cache an, den niemand mehr abraeumt -- und
    # zwei Zweige koennen verschiedene Paketstaende installieren.
    #
    # Das ist keine Theorie: In kontinuum-core lief derselbe Commit
    # auf main gruen und auf einem Zweig rot -- gleiches Abbild,
    # gleiche Python-Version, gleicher Code. Verschieden war der
    # Cache, und damit der Paketstand.
    key: pip
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs
    - node --version && python --version
    - |
      if [ -f requirements_test.txt ]; then
        pip install -q -r requirements_test.txt
      else
        pip install -q pytest pytest-asyncio voluptuous pyyaml jsonschema
      fi
  script:
    # Aufschreiben, was tatsaechlich installiert wurde. Ohne diese
    # Zeile laesst sich hinterher nicht mehr feststellen, ob zwei
    # Laeufe desselben Commits dieselben Pakete hatten.
    - pip freeze > installierte-pakete.txt
    - python -m pytest -q -rs --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - installierte-pakete.txt
    reports:
      junit: report.xml
  rules:
    - exists:
        - tests/**/*.py

# ── Kern-Kompatibilitaet: die PyPI-Fassung, die die Manifest-Regel erlaubt ──
# Durchsicht 04.10., Punkt 0b. Der TypeError vom Juli (should_consolidate
# mit einem Argument gegen eine Zwei-Argument-Signatur des Kerns 0.6.3)
# lebte in der Luecke zwischen dem Kern, den der Entwickler lokal hatte,
# und dem Kern, den die Installationen wirklich bekamen. Dieser Job
# installiert den Kern NACH DER MANIFEST-REGEL -- ausgelesen aus
# manifest.json, damit Job und Manifest nie auseinanderlaufen koennen --
# und faehrt die Suite dagegen. Die Signatur-Waechter und
# Konsolidierungs-Tests (test_wiring.py) haetten den Juli-Bruch hier
# sofort gezeigt.
#
# Der normale pytest-Job (ueber requirements_test.txt) bleibt bewusst
# unangepinnt: Er ist der Ausguck gegen die Zukunft -- kommt eine
# Kern-Version heraus, die unsere Regel nicht mehr erlaubt, wird ER rot
# und wir heben die Obergrenze bewusst an, statt sie still zu verlieren.
kern-pypi:
  stage: test
  image: python:3.13
  cache:
    key: pip-kern-pypi
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs
    - pip install -q pytest pytest-asyncio pytest-homeassistant-custom-component
    # Die Kern-Regel aus dem Manifest ist die einzige Quelle der Wahrheit:
    - |
      KERN=$(python - <<'PY'
      import json
      m = json.load(open("custom_components/kontinuum/manifest.json"))
      req = next((r for r in m.get("requirements", []) if r.startswith("kontinuum-core")), "")
      print(req)
      PY
      )
    - 'echo "Kern nach Manifest-Regel: $KERN"'
    - pip install -q "$KERN"
  script:
    # Beweis, WELCHE Kern-Fassung wirklich gefahren ist:
    - pip freeze | grep -i kontinuum
    - python -m pytest -q -rs --junitxml=report-kern-pypi.xml
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: report-kern-pypi.xml
  rules:
    - exists:
        - tests/**/*.py

# ── hassfest ──────────────────────────────────────────────────────────
# Home Assistants eigener Manifest-Pruefer, aus dem offiziellen Image.
# Prueft jede Integration unterhalb von custom_components/ einzeln.
hassfest:
  stage: validate
  image:
    name: ghcr.io/home-assistant/hassfest:latest
    entrypoint: [""]
  script:
    - cd /usr/src/homeassistant
    - |
      status=0
      for dir in "$CI_PROJECT_DIR"/custom_components/*/; do
        [ -f "$dir/manifest.json" ] || continue
        echo "── $(basename "$dir")"
        python -m script.hassfest --action validate --integration-path "$dir" || status=1
      done
      exit $status
  rules:
    - exists:
        - custom_components/*/manifest.json

# ── HACS-Angaben ──────────────────────────────────────────────────────
# Die offizielle HACS-Pruefung laeuft nicht: Sie liest Beschreibung,
# Themen und Releases eines GitHub-Repositories, und das gibt es hier
# nicht. Was sich ohne GitHub pruefen laesst, wird hier geprueft --
# damit die Angaben stimmen, wenn das Projekt doch wieder dorthin geht.
hacs-angaben:
  stage: validate
  image: python:3.13
  script:
    - |
      python - <<'PY'
      import json, pathlib, sys

      fehler = []
      hacs = json.loads(pathlib.Path("hacs.json").read_text(encoding="utf-8"))

      if not hacs.get("name"):
          fehler.append("hacs.json: 'name' fehlt")

      manifeste = sorted(pathlib.Path("custom_components").glob("*/manifest.json")) \
          if pathlib.Path("custom_components").is_dir() else []

      if not manifeste:
          fehler.append("keine Integration unter custom_components/ gefunden")

      for m in manifeste:
          daten = json.loads(m.read_text(encoding="utf-8"))
          ordner = m.parent.name
          if daten.get("domain") != ordner:
              fehler.append(f"{m}: domain '{daten.get('domain')}' passt nicht zum Ordner '{ordner}'")
          for pflicht in ("domain", "name", "version", "documentation", "codeowners"):
              if not daten.get(pflicht):
                  fehler.append(f"{m}: '{pflicht}' fehlt")
          print(f"── {ordner}: Version {daten.get('version')}")

      if fehler:
          print("\nGefunden:")
          for f in fehler:
              print(f"  • {f}")
          sys.exit(1)
      print("\nAngaben stimmig.")
      PY
  rules:
    - exists:
        - hacs.json

# ── Release ───────────────────────────────────────────────────────────
# Tag setzen genuegt: GitLab legt den Release-Eintrag an. Das hattest du
# auf GitHub nur bei einem einzigen Projekt.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Release fuer $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "Automatisch erzeugt aus Tag $CI_COMMIT_TAG."
  rules:
    - if: $CI_COMMIT_TAG
